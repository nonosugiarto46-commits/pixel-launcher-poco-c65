name: Build Pixel Launcher APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Lihat struktur file (buat debug)
        run: |
          echo "=== LIST FILE ==="
          ls -R
          echo "=== settings ==="
          cat settings.gradle.kts || echo "settings HILANG"
          echo "=== root build ==="
          cat build.gradle.kts || echo "root build HILANG"
          echo "=== app build ==="
          cat app/build.gradle.kts || echo "app build HILANG"
      - name: Install Gradle 8.4 manual
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          echo "$PWD/gradle-8.4/bin" >> $GITHUB_PATH
          gradle-8.4/bin/gradle --version
      - name: Build Debug APK
        run: gradle-8.4/bin/gradle assembleDebug --stacktrace --info
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Launcher-Poco-C65-APK
          path: app/build/outputs/apk/debug/app-debug.apk
